[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lowsun"
version = "0.0.1"
description = "Measured image formation for planetary and orbital vision"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{name = "Jeremy Fernsler"}]
keywords = ["planetary", "camera-model", "cahvore", "synthetic-data", "remote-sensing"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Image Processing",
]

[project.urls]
Homepage = "https://github.com/jfernsler/lowsun"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE"]